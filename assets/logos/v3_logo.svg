<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" fill="none">
  <!-- Minimalist Ridge Chevron Emblem -->
  <g transform="translate(2, 4)">
    <!-- Distant Misty Peak Chevron -->
    <path d="M6,26 L18,8 L30,26" stroke="#717c83" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" fill="none"/>
    
    <!-- Foreground Basalt Summit Chevron -->
    <path d="M12,28 L24,12 L36,28" stroke="#121517" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Horizon Line -->
    <line x1="2" y1="28" x2="40" y2="28" stroke="#121517" stroke-width="0.8" opacity="0.3"/>

    <!-- Subtle Warm Stone Summit Beacon -->
    <circle cx="24" cy="7" r="1.5" fill="#a67c52"/>
    <circle cx="24" cy="7" r="3.5" stroke="#a67c52" stroke-width="0.5" opacity="0.5" fill="none"/>
  </g>

  <!-- Quiet Editorial Typography -->
  <g transform="translate(54, 0)">
    <!-- Main Wordmark -->
    <text x="0" y="21" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="0.28em" fill="#121517">VERLYN TECH</text>
    
    <!-- Editorial Sub-notation -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="500" letter-spacing="0.32em" fill="#717c83">QUIET DISPATCH · 2026</text>
  </g>
</svg>
