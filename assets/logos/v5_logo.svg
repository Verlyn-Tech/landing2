<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 42" fill="none">
  <!-- Engraved Celestial Monogram Seal -->
  <g transform="translate(2, 2)">
    <!-- Base Circular Astrolabe Bezel -->
    <circle cx="19" cy="19" r="18" stroke="#111111" stroke-width="1.2" fill="none"/>
    <circle cx="19" cy="19" r="15.5" stroke="#111111" stroke-width="0.5" stroke-dasharray="1.5 2" opacity="0.6" fill="none"/>
    
    <!-- Inclined Celestial Orbital Ring -->
    <ellipse cx="19" cy="19" rx="18" ry="7.5" stroke="#1d4ed8" stroke-width="0.9" transform="rotate(-25 19 19)" opacity="0.8" fill="none"/>
    
    <!-- Classical Serif Monogram 'V' & 'T' -->
    <path d="M12,11 L19,27 L26,11" stroke="#111111" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <path d="M14,14 L24,14" stroke="#111111" stroke-width="1.5" stroke-linecap="square"/>
    <path d="M19,14 L19,23" stroke="#111111" stroke-width="1.5" stroke-linecap="square"/>
    
    <!-- Classical Serifs on Stem Ends -->
    <line x1="10" y1="11" x2="14" y2="11" stroke="#111111" stroke-width="1.2"/>
    <line x1="24" y1="11" x2="28" y2="11" stroke="#111111" stroke-width="1.2"/>

    <!-- Royal Blue Zenith Star Point -->
    <circle cx="19" cy="4" r="1.5" fill="#1d4ed8"/>
    <polygon points="19,1 20,3.5 22.5,4 20,4.5 19,7 18,4.5 15.5,4 18,3.5" fill="#1d4ed8" opacity="0.9"/>
  </g>

  <!-- Classical Editorial Typography -->
  <g transform="translate(50, 0)">
    <!-- Main Serif Wordmark -->
    <text x="0" y="22" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="18" font-weight="700" letter-spacing="0.12em" fill="#111111">VERLYN TECH</text>
    
    <!-- Monograph Folio Sub-notation -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.24em" fill="#1d4ed8">EST. 2026 · OPERATIONAL SYSTEMS</text>
  </g>
</svg>
