<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 42" fill="none">
  <!-- Brutalist 1-Bit Dither Monolith Emblem -->
  <g transform="translate(2, 2)">
    <!-- Base Dark Frame -->
    <rect x="0" y="0" width="38" height="38" fill="#111111" stroke="#333333" stroke-width="1"/>
    
    <!-- 1-Bit Bayer Matrix Dot Pattern (Left Side Dither Shade) -->
    <rect x="3" y="3" width="3" height="3" fill="#ffffff" opacity="0.15"/>
    <rect x="9" y="3" width="3" height="3" fill="#ffffff" opacity="0.3"/>
    <rect x="3" y="9" width="3" height="3" fill="#ffffff" opacity="0.3"/>
    <rect x="9" y="9" width="3" height="3" fill="#ffffff" opacity="0.5"/>
    
    <rect x="3" y="15" width="3" height="3" fill="#ffffff" opacity="0.4"/>
    <rect x="9" y="15" width="3" height="3" fill="#ffffff" opacity="0.6"/>
    <rect x="3" y="21" width="3" height="3" fill="#ffffff" opacity="0.2"/>
    <rect x="9" y="21" width="3" height="3" fill="#ffffff" opacity="0.4"/>

    <!-- Sharp Monolithic 'V' and 'T' Geometry in Optical White -->
    <path d="M14,6 L22,26 L30,6" stroke="#ffffff" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <path d="M19,10 L33,10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square"/>
    <path d="M26,10 L26,20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square"/>

    <!-- Phosphor Hazard Orange Accent Notch -->
    <rect x="0" y="30" width="8" height="8" fill="#ff5500"/>
    <rect x="32" y="0" width="6" height="6" fill="#ff5500"/>
  </g>

  <!-- Brutalist Heavy Typography -->
  <g transform="translate(50, 0)">
    <!-- Monumental Bold Wordmark -->
    <text x="0" y="24" font-family="'Archivo Black', 'Space Grotesk', sans-serif" font-size="16" font-weight="900" letter-spacing="-0.03em" fill="#ffffff">VERLYN TECH</text>
    
    <!-- Industrial Spec Notation -->
    <text x="0" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.22em" fill="#ff5500">DITHER MONO · SYS 04</text>
  </g>
</svg>
