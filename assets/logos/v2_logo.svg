<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 42" fill="none">
  <!-- Atmospheric Telemetry Filament Emblem -->
  <g transform="translate(2, 2)">
    <!-- Outer Cyan Bezel Frame -->
    <rect x="0" y="0" width="38" height="38" rx="6" fill="#082329" stroke="#1f5058" stroke-width="1.2"/>
    
    <!-- Atmospheric Radial Radar / Wave Arc -->
    <circle cx="19" cy="19" r="14" stroke="#4ba6b5" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4"/>
    <circle cx="19" cy="19" r="9" stroke="#4ba6b5" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Glowing Amber Filament Cathode 'V' -->
    <path d="M11,10 L19,27 L27,10" stroke="#f2b33d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M11,10 L19,27 L27,10" stroke="#ffc862" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Center Ion Core Beacon -->
    <circle cx="19" cy="18" r="2.5" fill="#f2b33d"/>
    <circle cx="19" cy="18" r="5" stroke="#f2b33d" stroke-width="0.5" opacity="0.6" fill="none"/>

    <!-- Subtle Optical Spectrum Ticks -->
    <line x1="19" y1="2" x2="19" y2="5" stroke="#ffc862" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="33" y1="19" x2="36" y2="19" stroke="#4ba6b5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="19" y1="33" x2="19" y2="36" stroke="#4ba6b5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2" y1="19" x2="5" y2="19" stroke="#4ba6b5" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Suite -->
  <g transform="translate(52, 0)">
    <!-- Brand Wordmark -->
    <text x="0" y="22" font-family="'Syne', 'Space Grotesk', sans-serif" font-size="16" font-weight="800" letter-spacing="0.06em" fill="#ffffff">VERLYN TECH</text>
    
    <!-- Telemetry Sub-notation -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.22em" fill="#f2b33d">ATMOSPHERIC TELEMETRY · DIR-02</text>
  </g>
</svg>
