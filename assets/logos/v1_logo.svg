<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" fill="none">
  <!-- Precision Cartographic Emblem -->
  <g transform="translate(2, 2)">
    <!-- Outer Technical Frame -->
    <rect x="0.5" y="0.5" width="39" height="39" stroke="#122118" stroke-width="1.2" fill="none"/>
    <rect x="3.5" y="3.5" width="33" height="33" stroke="#122118" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.4" fill="none"/>

    <!-- Surveyor Crosshairs at Frame Center -->
    <line x1="20" y1="0" x2="20" y2="40" stroke="#122118" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.3"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#122118" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.3"/>

    <!-- Interlocking Technical VT Monogram -->
    <!-- 'V' shape -->
    <path d="M8,10 L20,30 L32,10" stroke="#122118" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <!-- 'T' horizontal bar and vertical stem -->
    <path d="M12,14 L28,14" stroke="#122118" stroke-width="1.8" stroke-linecap="square"/>
    <path d="M20,14 L20,24" stroke="#122118" stroke-width="1.8" stroke-linecap="square"/>

    <!-- Burnt Terracotta Rust Benchmark Node -->
    <circle cx="20" cy="30" r="2.5" fill="#c84c24"/>
    <circle cx="20" cy="30" r="4.5" stroke="#c84c24" stroke-width="0.75" fill="none"/>

    <!-- Calibration Corner Ticks -->
    <path d="M0,4 L4,4 L4,0" stroke="#122118" stroke-width="1" fill="none"/>
    <path d="M36,0 L36,4 L40,4" stroke="#122118" stroke-width="1" fill="none"/>
    <path d="M0,36 L4,36 L4,40" stroke="#122118" stroke-width="1" fill="none"/>
    <path d="M36,40 L36,36 L40,36" stroke="#122118" stroke-width="1" fill="none"/>
  </g>

  <!-- Typography -->
  <g transform="translate(52, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="24" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" letter-spacing="-0.03em" fill="#122118">VERLYN TECH</text>
    
    <!-- Technical Descriptor -->
    <text x="0" y="36" font-family="'Plus Jakarta Sans', 'Space Grotesk', sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.18em" fill="#526b5c">OPERATIONAL SYSTEMS · SPEC 01</text>
  </g>
</svg>
